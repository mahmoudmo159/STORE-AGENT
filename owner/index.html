<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Dashboard</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap"><div id="login" class="panel"><h1>Owner Login</h1><input id="u" placeholder="Username"><br><br><input id="p" type="password" placeholder="Password"><br><br><button onclick="login()">Login</button><p id="le" class="muted"></p></div><div id="app" style="display:none"><div class="row" style="justify-content:space-between"><h1>Owner Dashboard</h1><button onclick="logout()">Logout</button></div><div class="grid"><div class="panel"><h2>Store</h2><div id="stats"></div></div><div class="panel"><h2>Owner Agent</h2><div id="ochat" class="chat"></div><div class="row"><input id="oi" placeholder="Ask the owner agent..."><button onclick="osend()">Send</button></div></div></div><div class="panel" style="margin-top:16px"><h2>Products</h2><div id="products"></div></div><div class="panel" style="margin-top:16px"><h2>Agent Studio</h2><a href="/agent">Open Agent Studio →</a></div></div></main><script>const API_BASE = window.API_BASE || 'http://localhost:3000';
let token=localStorage.getItem('owner_token');const $=id=>document.getElementById(id);async function login(){const r=await fetch(API_BASE+'/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:$('u').value,password:$('p').value})});const j=await r.json();if(!r.ok){$('le').textContent='Invalid login';return}token=j.token;localStorage.setItem('owner_token',token);boot()}function logout(){localStorage.removeItem('owner_token');location.reload()}async function boot(){if(!token)return;const r=await fetch(API_BASE+'/api/owner/products',{headers:{authorization:'Bearer '+token}});if(!r.ok){localStorage.removeItem('owner_token');return} $('login').style.display='none';$('app').style.display='block';load()}async function load(){const s=await fetch(API_BASE+'/api/store').then(r=>r.json());$('stats').innerHTML=`<p>Products: ${s.products.length}</p><p>Orders: ${s.orders.length}</p><p>Revenue: ${s.orders.reduce((a,o)=>a+Number(o.total||0),0)} ${s.settings.currency||'EGP'}</p>`;$('products').innerHTML=s.products.map(p=>`<div class="card" style="margin:8px 0"><b>${p.name||'Unnamed'}</b><br>${p.price||0} ${p.currency||s.settings.currency||'EGP'} · ${p.active===false?'Hidden':'Active'}</div>`).join('')||'<p class="muted">No products yet. Use the import/API layer to add products.</p>'}async function osend(){const i=$('oi'),m=i.value.trim();if(!m)return;i.value='';const box=$('ochat');box.innerHTML+=`<div class="msg user">${m}</div>`;const r=await fetch(API_BASE+'/api/owner/agent/chat',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({message:m})}).then(x=>x.json());box.innerHTML+=`<div class="msg bot">${r.response||r.error}</div>`;box.scrollTop=box.scrollHeight}boot();</script></body></html>
