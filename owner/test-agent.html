<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Agent Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #070b12;
      color: #fff;
      font-family: Arial, sans-serif;
      height: 100vh;
    }

    .app {
      max-width: 850px;
      height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: #0c121c;
    }

    header {
      padding: 18px;
      border-bottom: 1px solid #1d2938;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
    }

    .status {
      color: #55df9a;
      font-size: 13px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      margin-bottom: 15px;
      display: flex;
    }

    .message.user {
      justify-content: flex-start;
    }

    .message.agent {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 80%;
      padding: 13px 16px;
      border-radius: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: #24509a;
    }

    .agent .bubble {
      background: #151e2c;
      border: 1px solid #263548;
    }

    .composer {
      padding: 14px;
      border-top: 1px solid #1d2938;
      display: flex;
      gap: 10px;
    }

    textarea {
      flex: 1;
      resize: none;
      background: #101925;
      color: white;
      border: 1px solid #263548;
      border-radius: 13px;
      padding: 13px;
      font-size: 15px;
      outline: none;
    }

    button {
      width: 55px;
      border: 0;
      border-radius: 13px;
      background: #4f8cff;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    .info {
      padding: 8px 15px;
      font-size: 11px;
      color: #718096;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div>
      <div class="title">🤖 Agent Test</div>
      <div class="info">Store Agent</div>
    </div>

    <div class="status">
      ● Backend Online
    </div>
  </header>

  <main class="messages" id="messages">

    <div class="message agent">
      <div class="bubble">
        أهلاً 👋
        أنا الـStore Agent.

        اسألني عن المنتجات، الأسعار، المخزون أو الطلبات.
      </div>
    </div>

  </main>

  <div class="composer">

    <textarea
      id="message"
      rows="1"
      placeholder="اكتب رسالتك للـAgent..."
    ></textarea>

    <button id="send">➤</button>

  </div>

</div>


<script>

const API_URL =
  "https://store-agent-sage.vercel.app/api/agent/chat";

const STORE_ID =
  "6a784d01-7d04-4737-a3b9-10ef79df0518";

const messages =
  document.getElementById("messages");

const input =
  document.getElementById("message");

const send =
  document.getElementById("send");

let history = [];


function addMessage(text, type) {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message " + type;

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent = text;

  wrapper.appendChild(bubble);

  messages.appendChild(wrapper);

  messages.scrollTop =
    messages.scrollHeight;
}


async function sendMessage() {

  const text =
    input.value.trim();

  if (!text) return;

  addMessage(text, "user");

  input.value = "";

  send.disabled = true;

  addMessage("جاري التفكير...", "agent");

  const loading =
    messages.lastElementChild;


  try {

    const response =
      await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          storeId: STORE_ID,

          message: text,

          history: history

        })

      });


    const data =
      await response.json();


    loading.remove();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Agent request failed"
      );

    }


    const reply =
      data.response ||
      "لم يرجع الـAgent أي response.";


    addMessage(reply, "agent");


    history.push({
      role: "user",
      content: text
    });

    history.push({
      role: "assistant",
      content: reply
    });


    console.log("Agent result:", data);


  } catch (error) {

    loading.remove();

    addMessage(
      "❌ حصل خطأ: " +
      error.message,
      "agent"
    );

    console.error(error);

  } finally {

    send.disabled = false;

    input.focus();

  }

}


send.addEventListener(
  "click",
  sendMessage
);


input.addEventListener(
  "keydown",
  function(e) {

    if (
      e.key === "Enter" &&
      !e.shiftKey
    ) {

      e.preventDefault();

      sendMessage();

    }

  }
);

</script>

</body>
</html>
