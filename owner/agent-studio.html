<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Studio</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap"><div id="login" class="panel"><h1>Agent Studio</h1><p class="muted">Login from Owner Dashboard first.</p><a href="/owner">Go to Owner Dashboard</a></div><div id="app" style="display:none"><div class="row" style="justify-content:space-between"><h1>Agent Studio</h1><a href="/owner">← Owner</a></div><div class="grid"><section class="panel"><h2>Identity & Behavior</h2><label>Name</label><input id="name"><br><br><label>Tone</label><select id="tone"><option>friendly</option><option>professional</option><option>luxury</option><option>casual</option></select><br><br><label>Instructions</label><textarea id="instructions" rows="8"></textarea><br><br><button onclick="save()">Save</button><span id="saved" class="muted"></span></section><section class="panel"><h2>Live Preview</h2><div id="chat" class="chat"></div><div class="row"><input id="q" placeholder="Test the agent..."><button onclick="ask()">Send</button></div></section></div></div></main><script>const API_BASE = window.API_BASE || 'http://localhost:3000';
const token=localStorage.getItem('owner_token');const $=id=>document.getElementById(id);if(token){$('login').style.display='none';$('app').style.display='block';load()}async function load(){const s=await fetch(API_BASE+'/api/store').then(r=>r.json());$('name').value=s.agent?.name||'';$('tone').value=s.agent?.tone||'friendly';$('instructions').value=s.agent?.instructions||''}async function save(){await fetch(API_BASE+'/api/owner/agent-config',{method:'PUT',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({name:$('name').value,tone:$('tone').value,instructions:$('instructions').value})});$('saved').textContent=' Saved';setTimeout(()=>$('saved').textContent='',1500)}async function ask(){const q=$('q'),m=q.value.trim();if(!m)return;q.value='';$('chat').innerHTML+=`<div class="msg user">${m}</div>`;const r=await fetch(API_BASE+'/api/owner/agent/chat',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({message:m})}).then(x=>x.json());$('chat').innerHTML+=`<div class="msg bot">${r.response||r.error}</div>`;$('chat').scrollTop=$('chat').scrollHeight}</script></body></html>
