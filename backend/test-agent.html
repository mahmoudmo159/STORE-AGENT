<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Agent — Test</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #070b12;
      color: #f5f7fb;
      font-family: Inter, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .app {
      width: 100%;
      max-width: 850px;
      height: 90vh;
      max-height: 850px;
      display: flex;
      flex-direction: column;
      background: #0c121c;
      border: 1px solid #1d2938;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .header {
      padding: 18px 20px;
      border-bottom: 1px solid #1d2938;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #4f8cff, #58d5ff);
      display: grid;
      place-items: center;
      font-weight: 800;
      color: #06101c;
    }

    .title {
      font-size: 17px;
      font-weight: 700;
    }

    .subtitle {
      color: #8190a5;
      font-size: 12px;
      margin-top: 3px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #8d9aad;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #55df9a;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(85,223,154,.7);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .welcome {
      margin: auto;
      text-align: center;
      max-width: 500px;
    }

    .welcome h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #8290a3;
      line-height: 1.6;
      font-size: 14px;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
    }

    .suggestion {
      border: 1px solid #263548;
      background: #101925;
      color: #b9c5d5;
      border-radius: 999px;
      padding: 9px 13px;
      font-size: 12px;
      cursor: pointer;
    }

    .suggestion:hover {
      border-color: #4f8cff;
      color: white;
    }

    .message {
      display: flex;
      gap: 10px;
      max-width: 82%;
    }

    .message.user {
      margin-left: auto;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 32px;
      height: 32px;
      min-width: 32px;
      border-radius: 10px;
      background: #182332;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: bold;
    }

    .user .avatar {
      background: #315fae;
    }

    .bubble {
      padding: 12px 14px;
      border-radius: 14px;
      background: #111b29;
      border: 1px solid #202e40;
      line-height: 1.55;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user .bubble {
      background: #24509a;
      border-color: #3165ba;
    }

    .composer {
      padding: 14px;
      border-top: 1px solid #1d2938;
      background: #0a1018;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      min-height: 48px;
      max-height: 130px;
      resize: none;
      background: #101925;
      border: 1px solid #263548;
      color: white;
      border-radius: 14px;
      padding: 14px;
      outline: none;
      font: inherit;
      font-size: 14px;
    }

    textarea:focus {
      border-color: #4f8cff;
    }

    button.send {
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 14px;
      background: #4f8cff;
      color: white;
      cursor: pointer;
      font-size: 18px;
    }

    button.send:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .hint {
      text-align: center;
      color: #59677a;
      font-size: 10px;
      margin-top: 8px;
    }

    .typing {
      color: #7e8ca0;
      font-size: 12px;
      padding: 4px 0;
    }

    @media (max-width: 600px) {
      body {
        padding: 0;
      }

      .app {
        height: 100vh;
        max-height: none;
        border-radius: 0;
        border: 0;
      }

      .messages {
        padding: 16px;
      }

      .message {
        max-width: 90%;
      }

      .welcome h1 {
        font-size: 23px;
      }

      .header {
        padding: 14px 16px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header class="header">
      <div class="brand">
        <div class="logo">AI</div>

        <div>
          <div class="title">Test Agent</div>
          <div class="subtitle">Agent testing environment</div>
        </div>
      </div>

      <div class="status">
        <span class="dot"></span>
        Online
      </div>
    </header>

    <main class="messages" id="messages">

      <div class="welcome" id="welcome">
        <h1>Test your AI Agent</h1>

        <p>
          Send a message to test how your agent understands
          business data, answers questions and performs tasks.
        </p>

        <div class="suggestions">
          <button class="suggestion"
            onclick="useSuggestion('Show me the store data')">
            Show store data
          </button>

          <button class="suggestion"
            onclick="useSuggestion('How many products do I have?')">
            Products
          </button>

          <button class="suggestion"
            onclick="useSuggestion('Give me a sales summary')">
            Sales summary
          </button>
        </div>
      </div>

    </main>

    <div class="composer">

      <div class="input-row">

        <textarea
          id="input"
          placeholder="Ask your agent something..."
          rows="1"
        ></textarea>

        <button
          class="send"
          id="send"
          onclick="sendMessage()"
        >
          ➤
        </button>

      </div>

      <div class="hint">
        Enter to send • Shift + Enter for new line
      </div>

    </div>

  </div>

<script>

  /*
    IMPORTANT:
    This is the API endpoint your page will call.

    If your Vercel backend uses another endpoint,
    change this value.
  */

  const API_URL = "/api/agent/chat";

  const messages = document.getElementById("messages");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const welcome = document.getElementById("welcome");


  function useSuggestion(text) {
    input.value = text;
    input.focus();
  }


  function addMessage(text, type) {

    if (welcome) {
      welcome.remove();
    }

    const message = document.createElement("div");
    message.className = `message ${type}`;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = type === "user" ? "U" : "AI";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    message.appendChild(avatar);
    message.appendChild(bubble);

    messages.appendChild(message);

    messages.scrollTop = messages.scrollHeight;
  }


  function addTyping() {

    const typing = document.createElement("div");

    typing.className = "message assistant";
    typing.id = "typing";

    typing.innerHTML = `
      <div class="avatar">AI</div>
      <div class="typing">Agent is thinking...</div>
    `;

    messages.appendChild(typing);

    messages.scrollTop = messages.scrollHeight;
  }


  function removeTyping() {

    const typing = document.getElementById("typing");

    if (typing) {
      typing.remove();
    }
  }


  async function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");

    input.value = "";
    input.style.height = "48px";

    send.disabled = true;

    addTyping();

    try {

      const response = await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          message: text
        })

      });


      const data = await response.json();

      removeTyping();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Agent request failed"
        );

      }


      /*
        Supports common backend response formats:
        { reply: "..." }
        { message: "..." }
        { response: "..." }
        { answer: "..." }
      */

      const reply =
        data.reply ??
        data.message ??
        data.response ??
        data.answer ??
        JSON.stringify(data, null, 2);


      addMessage(reply, "assistant");


    } catch (error) {

      removeTyping();

      addMessage(
        "❌ Error: " + error.message,
        "assistant"
      );

    } finally {

      send.disabled = false;
      input.focus();

    }

  }


  input.addEventListener("keydown", function(event) {

    if (event.key === "Enter" && !event.shiftKey) {

      event.preventDefault();

      sendMessage();

    }

  });


  input.addEventListener("input", function() {

    this.style.height = "48px";

    this.style.height =
      Math.min(this.scrollHeight, 130) + "px";

  });

</script>

</body>
</html>
