<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Store Agent Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #070b12;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 850px;
      height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: #0c121c;
    }

    header {
      padding: 18px;
      border-bottom: 1px solid #1d2938;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
    }

    .sub {
      color: #7f8da1;
      font-size: 12px;
      margin-top: 5px;
    }

    .status {
      color: #55df9a;
      font-size: 12px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      display: flex;
      margin-bottom: 16px;
    }

    .user {
      justify-content: flex-start;
    }

    .agent {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 85%;
      padding: 13px 16px;
      border-radius: 15px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
    }

    .user .bubble {
      background: #24509a;
    }

    .agent .bubble {
      background: #151e2c;
      border: 1px solid #263548;
    }

    .error .bubble {
      background: #35171b;
      border: 1px solid #7f2933;
      direction: ltr;
      text-align: left;
    }

    .composer {
      padding: 14px;
      border-top: 1px solid #1d2938;
      display: flex;
      gap: 10px;
      background: #090e16;
    }

    textarea {
      flex: 1;
      min-height: 50px;
      max-height: 130px;
      resize: none;
      background: #101925;
      color: white;
      border: 1px solid #263548;
      border-radius: 13px;
      padding: 13px;
      font-size: 15px;
      outline: none;
    }

    textarea:focus {
      border-color: #4f8cff;
    }

    button {
      width: 55px;
      height: 50px;
      border: 0;
      border-radius: 13px;
      background: #4f8cff;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    .debug {
      margin: 0 20px 10px;
      padding: 10px;
      background: #080d14;
      border: 1px solid #1d2938;
      border-radius: 10px;
      color: #718096;
      font-size: 11px;
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      display: none;
    }

    @media (max-width: 600px) {
      .app {
        height: 100vh;
      }

      .bubble {
        max-width: 90%;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div>
      <div class="title">🤖 Store Agent Test</div>
      <div class="sub">Real Backend Connection</div>
    </div>

    <div class="status">
      ● Online
    </div>
  </header>

  <main class="messages" id="messages">

    <div class="message agent">
      <div class="bubble">
        أهلاً 👋

        أنا الـStore Agent.

        جرّب تسألني:
        • عندي كام منتج؟
        • سعر المنتج كام؟
        • إيه المنتجات المتاحة؟
        • هل المنتج متوفر؟
      </div>
    </div>

  </main>

  <div class="debug" id="debug"></div>

  <div class="composer">

    <textarea
      id="message"
      placeholder="اكتب رسالتك..."
      rows="1"
    ></textarea>

    <button id="send">➤</button>

  </div>

</div>

<script>

const API_URL =
  "/api/agent/chat";

const STORE_ID =
  "6a784d01-7d04-4737-a3b9-10ef79df0518";

const messages =
  document.getElementById("messages");

const input =
  document.getElementById("message");

const send =
  document.getElementById("send");

const debug =
  document.getElementById("debug");

let history = [];


function addMessage(text, type = "agent") {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message " + type;

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent = text;

  wrapper.appendChild(bubble);

  messages.appendChild(wrapper);

  messages.scrollTop =
    messages.scrollHeight;
}


function showDebug(text) {

  debug.style.display = "block";

  debug.textContent = text;

  messages.scrollTop =
    messages.scrollHeight;
}


async function sendMessage() {

  const text =
    input.value.trim();

  if (!text) return;

  addMessage(text, "user");

  input.value = "";

  send.disabled = true;

  const loading =
    document.createElement("div");

  loading.className =
    "message agent";

  loading.innerHTML =
    `<div class="bubble">جاري التفكير...</div>`;

  messages.appendChild(loading);

  messages.scrollTop =
    messages.scrollHeight;


  try {

    const response =
      await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },

        body: JSON.stringify({

          storeId: STORE_ID,

          message: text,

          history: history

        })

      });


    const raw =
      await response.text();


    loading.remove();


    console.log(
      "HTTP STATUS:",
      response.status
    );

    console.log(
      "RAW RESPONSE:",
      raw
    );


    let data = null;


    try {

      data =
        JSON.parse(raw);

    } catch (parseError) {

      showDebug(
        "HTTP STATUS: " +
        response.status +
        "\n\nRAW RESPONSE:\n" +
        raw.substring(0, 1000)
      );

      throw new Error(
        "Backend returned non-JSON response."
      );
    }


    if (!response.ok) {

      showDebug(
        "HTTP STATUS: " +
        response.status +
        "\n\nJSON RESPONSE:\n" +
        JSON.stringify(
          data,
          null,
          2
        )
      );

      throw new Error(
        data.error ||
        "Backend request failed."
      );
    }


    const reply =
      data.response ||
      data.message ||
      data.answer ||
      "الـAgent لم يرجع response.";


    addMessage(
      reply,
      "agent"
    );


    history.push({

      role: "user",

      content: text

    });


    history.push({

      role: "assistant",

      content: reply

    });


    showDebug(
      "STATUS: " +
      response.status +
      "\n\nAGENT RESULT:\n" +
      JSON.stringify(
        data,
        null,
        2
      )
    );


  } catch (error) {

    loading.remove();

    addMessage(
      "❌ " + error.message,
      "error"
    );

    console.error(
      "AGENT ERROR:",
      error
    );

  } finally {

    send.disabled = false;

    input.focus();

  }

}


send.addEventListener(
  "click",
  sendMessage
);


input.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


input.addEventListener(
  "input",
  function() {

    this.style.height =
      "50px";

    this.style.height =
      Math.min(
        this.scrollHeight,
        130
      ) + "px";

  }
);

</script>

</body>
  </html>
