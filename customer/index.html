<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Store AI Assistant</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap"><div class="panel"><h1>Store AI Assistant</h1><p class="muted">Ask about products, stock, shipping or orders.</p><div id="chat" class="chat"></div><div class="row" style="margin-top:12px"><input id="input" placeholder="Ask in any language..."><button onclick="send()">Send</button></div></div></main><script type="module">const API_BASE = window.API_BASE || 'http://localhost:3000';
const chat=document.querySelector('#chat'),input=document.querySelector('#input');let history=[];function add(text,who){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}window.send=async()=>{const m=input.value.trim();if(!m)return;input.value='';add(m,'user');const r=await fetch(API_BASE+'/api/agent/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:m,history})}).then(x=>x.json());add(r.response||'Something went wrong.','bot');history.push({role:'user',content:m});history.push({role:'assistant',content:r.response,slots:r.entities||{}})};input.addEventListener('keydown',e=>{if(e.key==='Enter')send()});add('Hi! How can I help you today?','bot');</script></body></html>
